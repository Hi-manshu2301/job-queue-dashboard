services:
  - type: web
    name: job-queue-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /jobs
    envVars:
      - key: CORS_ORIGIN
        sync: false
      # To switch to durable Postgres storage instead of the ephemeral
      # SQLite file (see README "Deployment"), add a DATABASE_URL env var
      # pointing at a Postgres instance - no code changes needed, the app
      # already picks the driver based on whether this is set.
